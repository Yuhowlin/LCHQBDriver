[project]
name = "lchqb-driver"
version = "0.1.0"
description = "LCH Qblox driver — Qblox backend for the scqo instrument-agnostic experiment API"
readme = "CLAUDE.md"
requires-python = ">=3.10,<3.13"
license = { text = "BSD-3-Clause" }
dependencies = [
    "scqo",                  # the shared, vendor-free experiment API (install editable: pip install -e ../SCQO)
    # Qblox control stack (Schedule, HardwareAgent, QuantumDevice). The pre-release
    # floor is REQUIRED: PyPI's only non-prerelease is an empty 0.0.0 placeholder that
    # fails to build, and resolvers only consider pre-releases when the specifier
    # names one. 1.0.0b4 = the version proven against the lab cluster (2026-07-04).
    "qblox-scheduler>=1.0.0b4",
    "xarray>=2024.7.0",
    "lmfit>=1.3.3",
    "numpy>=1.26",
]

# GOAL 1 — independence: this list contains NO Quantum Machines packages
# (no qm-qua, quam, quam-builder, qualibrate, qualibration-libs). LCHQBDriver
# imports only `scqo` (vendor-free) and the Qblox stack.

# Advertise the Qblox experiments to scqo so Session.catalog() finds them without the
# consumer importing lchqb.experiments by hand (scqo loads this lazily on first catalog()).
[project.entry-points."scqo.experiments"]
lchqb = "lchqb.experiments"

# Advertise the Qblox BACKEND factory to the scqo CLI: `backend = "qblox"`/"qblox_sim"
# in the lab config resolves to this (needs scqo >= 0.4.0; re-run `uv pip install -e`
# after adding — entry points register at install time, not import time).
[project.entry-points."scqo.backends"]
qblox = "lchqb.scqo_backend:build_backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lchqb"]

[tool.uv.sources]
scqo = { path = "../SCQO", editable = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.black]
line-length = 120
