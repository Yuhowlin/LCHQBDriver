[project]
name = "lchqb-driver"
version = "0.1.0"
description = "LCH Qblox driver — Qblox backend for the scqo instrument-agnostic experiment API"
readme = "CLAUDE.md"
requires-python = ">=3.10,<3.13"
license = { text = "BSD-3-Clause" }
dependencies = [
    "scqo",                  # the shared, vendor-free experiment API (install editable: pip install -e ../SCQO)
    "qblox-scheduler",       # Qblox control stack (Schedule, HardwareAgent, QuantumDevice)
    "xarray>=2024.7.0",
    "lmfit>=1.3.3",
    "numpy>=1.26",
]

# GOAL 1 — independence: this list contains NO Quantum Machines packages
# (no qm-qua, quam, quam-builder, qualibrate, qualibration-libs). LCHQBDriver
# imports only `scqo` (vendor-free) and the Qblox stack.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lchqb"]

[tool.uv.sources]
scqo = { path = "../SCQO", editable = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.black]
line-length = 120
